site_name: Life Systems
theme:
  name: material
  system: dark
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
nav:
  - Home: index.md

  - Shane:
    - Pool:
      - shane/pool/overview.md
      - shane/pool/diagram.md
      - shane/pool/startup.md
      - shane/pool/maintenance.md
      - shane/pool/troubleshooting.md
      - shane/pool/parts.md
      - shane/pool/manuals.md
      - shane/pool/history.md
      - shane/pool/photos.md

  - Money System:
    - Introduction: money-system/introduction.md
    - Overview: money-system/overview.md
    - About: money-system/about.md
    - Income Split: money-system/income-split.md
    - Emergency Fund: money-system/emergency-fund.md
    - Investing Basics: money-system/investing-basics.md
    - Paying Taxes: money-system/paying-taxes.md

  - Networking / Tech:
    - Overview: tech/overview.md
    - Systems Integration: tech/systems-integration.md
    - VLAN Guide: tech/vlan.md
    - Camera System: tech/cameras.md

  - Business (Future):
    - Overview: business/overview.md
    - Starting a Business: business/starting.md
    - Running a Business: business/running.md
    - Growing a Business: business/growing.md

  - Linux:
    - Documentation:
        - linux/documentation/wsl_zsh-getting-started-1.md
        - linux/documentation/wsl_zsh-zshrc-config-2.md
        - linux/documentation/wsl_zsh-tools-config-3.md
        - linux/documentation/wsl_zsh-shell-config-4.md
        - Life Systems:
          - linux/documentation/life-systems/life-systems.md
        - Templates:
          - linux/documentation/templates/templates.md

    - Infrastructure:
        - linux/infrastructure/env-descriptions.md
        - Docker:
            - linux/infrastructure/docker/configuration.md
            - linux/infrastructure/docker/installation.md
            - linux/infrastructure/docker/maintenance.md
            - linux/infrastructure/docker/overview.md
            - linux/infrastructure/docker/troubleshooting.md
            - linux/infrastructure/docker/docker.md
        - Kubernetes:
            - linux/infrastructure/kubernetes/kubernetes.md
        - Networking:
            - linux/infrastructure/networking/networking.md
        - tailscale:
            - linux/infrastructure/tailscale/tailscale.md


    - Software:
        - linux/software/software.md
        - Bash:
            - linux/software/bash/bash.md
        - Python:
            - linux/software/python/python.md

    - Testing:
        - linux/testing/testing.md
        - linux/testing/troubleshooting.md

    - Archive:
        - linux/archive/archive.md

  - AI: ai/overview.md

  - Engineering Lab:
    - Overview: engineering-lab/overview.md
    - Relationship Diagrams: engineering-lab/relationship-diagrams.md
    - UI Components: engineering-lab/ui-components.md

    - Experiments:
        - Mermaid: engineering-lab/experiments/mermaid/mermaid.md
        - CSS: engineering-lab/experiments/css/css.md
        - Icons: engineering-lab/experiments/icons/icons.md
        - JavaScript: engineering-lab/experiments/javascript/javascript.md

    - Engineering Design System:
      - engineering-lab/engineering-design-system/buttons.md
      - engineering-lab/engineering-design-system/challenge-cards.md
      - engineering-lab/engineering-design-system/color-palette.md
      - engineering-lab/engineering-design-system/css-reference.md
      - engineering-lab/engineering-design-system/diagram-cards.md
      - engineering-lab/engineering-design-system/exercise-cards.md
      - engineering-lab/engineering-design-system/hero-banner.md
      - engineering-lab/engineering-design-system/icons.md
      - engineering-lab/engineering-design-system/legend-cards.md
      - engineering-lab/engineering-design-system/navigation-footer.md
      - engineering-lab/engineering-design-system/objective-boxes.md
      - engineering-lab/engineering-design-system/section-headers.md
      - engineering-lab/engineering-design-system/standards-checklists.md
      - engineering-lab/engineering-design-system/tabs.md
      - engineering-lab/engineering-design-system/typography.md

    - Templates:
        - Network Architecture: engineering-lab/templates/network-architecture/network-architecture.md
        - Docker Architecture: engineering-lab/templates/docker-architecture/docker-architecture.md
        - VLAN Documentation: engineering-lab/templates/vlan-documentation/vlan-documentation.md
        - API Flow: engineering-lab/templates/api-flow/api-flow.md
        - Database Layout: engineering-lab/templates/database-layout/database-layout.md
        - Security Review: engineering-lab/templates/security-review/security-review.md

  - test:
    - test.md: test/test.md
    - diagrams.md: test/diagrams.md
    - grids.md: test/grids.md
    - lists.md: test/lists.md
    - data.md: test/data.md
    - math.md: test/math.md
    - Flowcharts: test/flowcharts.md
    - Sequence Diagrams: test/sequence-diagrams.md
    - ER Diagrams: test/er-diagrams.md
    - Mind Maps: test/mind-maps.md
    - Material Components: test/material-components.md
    - CSS Experments: test/css-experiments.md
    - Icons: test/icons.md
    - Mermaid Playground: test/mermaid-playground.md
    - Templates: test/templates.md

plugins:
  - search

extra_javascript:
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/engineering-lab.css

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg