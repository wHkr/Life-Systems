site_name: Life Systems
theme:
  name: material
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
nav:
  - test:
    - test.md: test/test.md
    - diagrams.md: test/diagrams.md
    - grids.md: test/grids.md
    - lists.md: test/lists.md
    - data.md: test/data.md
    - math.md: test/math.md
  - Home: index.md
  - Money System:
    - Introduction: money-system/introduction.md
    - Overview: money-system/overview.md
    - About: money-system/about.md
    - Income Split: money-system/income-split.md
    - Emergency Fund: money-system/emergency-fund.md
    - Investing Basics: money-system/investing-basics.md
    - Paying Taxes: money-system/paying-taxes.md
  - Networking / Tech:
    - Overview: tech/overview.md
    - Systems Integration: tech/systems-integration.md
    - VLAN Guide: tech/vlan.md
    - Camera System: tech/cameras.md
  - Business (Future):
    - Overview: business/overview.md
    - Starting a Business: business/starting.md
    - Running a Business: business/running.md
    - Growing a Business: business/growing.md
  - Linux:
    - Overview: linux/overview.md
    - Installation: linux/installation.md
    - Configuration: linux/configuration.md
    - Maintenance: linux/maintenance.md
    - Troubleshooting: linux/troubleshooting.md
  - Docker:
    - Overview: docker/overview.md
    - Installation: docker/installation.md
    - Configuration: docker/configuration.md
    - Maintenance: docker/maintenance.md
    - Troubleshooting: docker/troubleshooting.md
  - AI: ai/overview.md
  - Engineering Lab:
    - Overview: engineering-lab/overview.md
      Experiments:
        - Mermaid:
        - CSS:
        - Icons:
        - JavaScript:
      Templates:
        - Network Architecture:
        - Docker Architecture:
        - VLAN Documentation:
        - API Flow:
        - Database Layout:
        - Security Review:
    - Relationship Diagrams: engineering-lab/relationship-diagrams.md
    - Flowcharts:
    - Sequence Diagrams:
    - ER Diagrams:
    - Mind Maps:
    - Material Components:
    - CSS Experments:
    - Icons
    - Mermaid Playground:
    - Templates:

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg